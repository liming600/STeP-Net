# PointNet++ 帧级分类器 (外部基线)
# 忠实复现 "Fall Detection using LiDAR Sensor with PointNet++" (Ayyagari et al., 2025, ICSADL)：
#   - 单帧分类：每个点云帧 = 一个独立样本 (无序列/滑窗)
#   - 数据增强：random rotation / translation / scaling / jitter (仅训练集)
#   - 架构：标准 PointNet++ 分类器 (3 SA + 3 FC, radii [0.2,0.4], mlp [64,128,256,512,1024])
#   - 优化：Adam lr=1e-4 wd=1e-4, StepLR(5,0.5), CE, batch=32 帧, ~1.5M 参数
# 与原文的差异 (刻意，见代码/论文讨论)：
#   - 输入点数 1024 (而非 512)：与主方法 STeP-Net 对齐，保证对比公平
#   - 二分类 (而非 4 类)：本项目数据集为 daily/fall
#   - 训练 101 epochs + 早停 (而非 20)：与主方法 LOSO 协议一致
#   - LOSO 按志愿者划分 (而非 60/20/20 随机划分)：与主方法协议一致

optimizer:
  type: Adam
  kwargs:
    lr: 0.0001
    weight_decay: 0.0001

scheduler:
  type: StepLR
  kwargs:
    step_size: 5
    gamma: 0.5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      bs: 32
      use_augmentation: True
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      bs: 32
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      bs: 32

model:
  NAME: PointNetPP_Frame
  num_classes: 2
  classifier_in_dim: 1024

  # 标准 PointNet++ 分类器 (Qi et al., 2017)：
  # 与 Ayyagari et al. (2025) Table I 对齐
  #   - 3 个 Set Abstraction 层 (radii [0.2, 0.4], 最后一层 global)
  #   - mlp 首元素 = 基础特征通道（xyz 已由库 use_xyz 自动 +3）
  #   - 输出通道对应论文 [64,128,256,512,1024]
  sa_modules:
    - npoint: 512
      radius: 0.2
      nsample: 32
      mlp: [3, 64, 64, 128]
    - npoint: 128
      radius: 0.4
      nsample: 64
      mlp: [128, 128, 256]
    - npoint: null
      radius: null
      nsample: null
      mlp: [256, 512, 1024]

total_bs: 32
max_epoch: 101
grad_norm_clip: 10
npoints: 1024
step_per_update: 1
