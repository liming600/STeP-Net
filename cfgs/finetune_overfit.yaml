optimizer:
  type: AdamW
  kwargs:
    lr: 0.00025  # 可以尝试稍微调小一点，如 0.0001，防止梯度爆炸，或者保持 0.0005 加速过拟合
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 16  # 建议用 16 或 20，样本少，更易过拟合
      stride: 4
      bs: 8  # 显存警告！全参数训练显存占用极大，必须调小 BS
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 16
      stride: 16
      bs: 16
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 16
      stride: 16
      bs: 8

model:
  NAME: PointMAE_GRU
  freeze_encoder: false  # <--- [关键] 核心修改：解冻编码器，允许全参数更新
  gru_hidden_size: 256
  gru_num_layers: 2
  bidirectional: false
  num_classes: 2
  point_mae_config:
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.3 # 可以尝试设为 0.0，移除 Dropout 会让过拟合更严重
    cls_dim: 2
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

total_bs: 8
max_epoch: 60  # 跑 60 轮足够看到过拟合了
grad_norm_clip: 10
npoints: 1024
step_per_update: 1