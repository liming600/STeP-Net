# ===============================================================
# ===          用于LIDARHuman26M数据集的预训练配置            ===
# ===============================================================

# 使用标准YAML缩进语法，而不是花括号

optimizer:
  type: AdamW
  kwargs:
    lr: 0.001
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 300
    initial_epochs: 10

dataset:
  train:
    _base_: cfgs/dataset_configs/LIDARHuman26MDataset.yaml
    others:
      subset: 'train'
      npoints: 1024
      bs: 64
  val:
    _base_: cfgs/dataset_configs/LIDARHuman26MDataset.yaml
    others:
      subset: 'test'
      npoints: 1024
      bs: 64

model:
  NAME: Point_MAE
  group_size: 32
  num_group: 64
  loss: cdl2
  transformer_config:
    mask_ratio: 0.6
    mask_type: 'rand'
    trans_dim: 384
    encoder_dims: 384
    depth: 12
    drop_path_rate: 0.1
    num_heads: 6
    decoder_depth: 4
    decoder_num_heads: 6

# 顶层参数
npoints: 1024
total_bs: 64
step_per_update: 1
max_epoch: 300