# ===============================================================
# ===   用于时序跌倒检测的配置 (LSTM) - From Scratch      ===
# ===        (采用梯度累加策略防止显存溢出)                   ===
# ===============================================================

optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 16
      stride: 4
      # --- [修改点 1] 物理 Batch Size 减小 ---
      # 从 16 改为 4，为了在解冻 Encoder 的情况下塞进显存
      bs: 4
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 16
      stride: 16
      bs: 16 # 验证时不计算梯度，显存占用较小，可以设稍微大一点
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 16
      stride: 16
      bs: 16

model:
  NAME: PointMAE_LSTM
  # --- [关键点] 必须为 false 才能从零训练 ---
  freeze_encoder: false
  lstm_hidden_size: 256
  lstm_num_layers: 2
  bidirectional: false
  num_classes: 2
  point_mae_config:
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.1
    cls_dim: 2
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

# 顶层参数
total_bs: 16 # 这个参数仅作记录，实际生效的是下面的 step_per_update * dataset.bs
max_epoch: 100
grad_norm_clip: 10
npoints: 1024

# --- [修改点 2] 梯度累加步数 ---
# 物理BS(4) * 累加步数(4) = 等效BS(16)
# 这意味着每前向传播 4 次才进行一次 optimizer.step()
step_per_update: 4