# ===============================================================
# ===          用于时序跌倒检测的微调配置 (LSTM)               ===
# ===============================================================

optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 8
      stride: 2
      bs: 32
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 8
      stride: 8
      bs: 64
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 8
      stride: 8
      bs: 32

model:
  NAME: PointMAE_GRU # <-- [核心修改]
  freeze_encoder: true
  gru_hidden_size: 256
  gru_num_layers: 2   # <-- [核心修改]
  bidirectional: false
  num_classes: 2

  point_mae_config: # (不变)
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.3
    cls_dim: 2 # 这个值虽然用不上，但模型定义需要
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

# 顶层参数 (不变)
total_bs: 32
max_epoch: 100
grad_norm_clip: 10
npoints: 1024
step_per_update: 1