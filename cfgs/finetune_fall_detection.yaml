# ===============================================================
# ===          单帧跌倒检测微调的【结构完整】配置             ===
# ===============================================================

optimizer:
  type: AdamW
  kwargs:
    lr: 0.00005
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

# --- [核心修改：在 every 'others' 块中添加 bs 参数] ---
dataset:
  train:
    _base_: cfgs/dataset_configs/FallDataset.yaml
    others:
      subset: 'train'
      npoints: 1024
      bs: 32  # <-- 添加这一行
  val:
    _base_: cfgs/dataset_configs/FallDataset.yaml
    others:
      subset: 'val'
      npoints: 1024
      bs: 64  # <-- 添加这一行 (验证时bs可以更大)
  test:
    _base_: cfgs/dataset_configs/FallDataset.yaml
    others:
      subset: 'test'
      npoints: 1024
      bs: 64  # <-- 添加这一行 (测试时bs也可以更大)

model:
  NAME: PointTransformer
  trans_dim: 384
  depth: 12
  drop_path_rate: 0.2
  cls_dim: 2
  num_heads: 6
  group_size: 32
  num_group: 64
  encoder_dims: 384

# 顶层参数
npoints: 1024
total_bs: 32
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10