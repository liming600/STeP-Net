# ===============================================================
# ===         用于时序跌倒检测的微调配置 (LSTM)               ===
# ===============================================================

optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005 # 学习率可以从这个值开始尝试
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100 # 时序模型可能不需要那么多epoch
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 16 # 定义序列长度
      stride: 4           # 定义滑窗步长
      bs: 16              # 序列模型显存占用大，batch size减小
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 16
      stride: 16          # 验证时可以不用重叠滑窗
      bs: 32
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 16
      stride: 16
      bs: 16

model:
  NAME: PointMAE_LSTM
  freeze_encoder: true # 推荐先冻结编码器进行尝试
  lstm_hidden_size: 256
  lstm_num_layers: 2
  bidirectional: false
  num_classes: 2
  point_mae_config: # 这里定义了内部编码器的结构
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.3 # 数据量变小了，需要更强的抗过拟合手段
    cls_dim: 2 # 这个值虽然用不上，但模型定义需要
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

# 顶层参数
total_bs: 16
max_epoch: 100
grad_norm_clip: 10
npoints: 1024
step_per_update: 1