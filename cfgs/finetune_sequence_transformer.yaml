# ===============================================================
# ===       用于时序跌倒检测的微调配置 (Transformer)          ===
# ===============================================================

optimizer:
  type: AdamW
  kwargs:
    lr: 0.0001 # Transformer对学习率更敏感，建议从一个更小的值开始
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 16
      stride: 4
      bs: 16 # Batch size可能需要根据显存调整
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 16
      stride: 16
      bs: 32
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 16
      stride: 16
      bs: 16

model:
  NAME: PointMAE_Transformer # <-- 指定使用我们的新模型
  freeze_encoder: true
  num_classes: 2

  # 内部Point-MAE编码器的配置
  point_mae_config:
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.3
    cls_dim: 2
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

  # 外部时序Transformer的配置
  temporal_transformer_config:
    num_heads: 6      # 注意力头的数量
    num_layers: 3     # Transformer Encoder的层数
    dim_feedforward: 1024 # 前馈网络的隐藏层维度
    dropout: 0.1      # Dropout比率

  # 用于位置编码的数据集配置
  dataset_config:
    sequence_length: 16

# 顶层参数
total_bs: 16
max_epoch: 100
grad_norm_clip: 10
npoints: 1024
step_per_update: 1