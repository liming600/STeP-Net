# ===============================================================
# ===       用于LIDARHuman26M数据集的可视化专用配置         ===
# ===============================================================

dataset:
  train:
    _base_: cfgs/dataset_configs/LIDARHuman26MDataset.yaml
    others:
      subset: 'train'
      npoints: 1024
      bs: 4 # 值不重要
  val:
    _base_: cfgs/dataset_configs/LIDARHuman26MDataset.yaml
    others:
      subset: 'test'
      npoints: 1024
      bs: 4 # 值不重要
  # --- [核心修改] ---
  test:
    _base_: cfgs/dataset_configs/LIDARHuman26MDataset.yaml
    others:
      subset: 'test'
      npoints: 1024
      bs: 1 # <-- 添加这一行，可视化时batch size为1

# ... (model 和顶层参数保持不变) ...
model:
  NAME: Point_MAE
  group_size: 32
  num_group: 64
  loss: cdl2
  transformer_config:
    mask_ratio: 0.6
    mask_type: 'rand'
    trans_dim: 384
    encoder_dims: 384
    depth: 12
    drop_path_rate: 0.1
    num_heads: 6
    decoder_depth: 4
    decoder_num_heads: 6

npoints: 1024
total_bs: 4
step_per_update: 1
max_epoch: 1