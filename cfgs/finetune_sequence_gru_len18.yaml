optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 100
    initial_epochs: 5

# --- [核心修改：恢复 _base_ 结构] ---
dataset:
  train:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'train'
      sequence_length: 18
      stride: 5
      bs: 15
  val:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'val'
      sequence_length: 18
      stride: 18
      bs: 30
  test:
    _base_: cfgs/dataset_configs/FallSequenceDataset.yaml
    others:
      subset: 'test'
      sequence_length: 18
      stride: 18
      bs: 15

model:
  NAME: PointMAE_GRU
  freeze_encoder: true
  gru_hidden_size: 256
  gru_num_layers: 2
  bidirectional: false
  num_classes: 2
  point_mae_config:
    NAME: PointTransformer
    trans_dim: 384
    depth: 12
    drop_path_rate: 0.1
    cls_dim: 2
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 384

# 顶层参数
total_bs: 15
max_epoch: 100
grad_norm_clip: 10
npoints: 1024
step_per_update: 1